name: Build portable exe
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo build --release
      - name: Rename
        shell: cmd
        run: copy target\release\markitdown-gui.exe "MarkItDown GUI.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: MarkItDown-GUI
          path: MarkItDown GUI.exe
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: MarkItDown GUI ${{ github.ref_name }}
          body_path: docs/RELEASE_NOTES.md
          files: MarkItDown GUI.exe
