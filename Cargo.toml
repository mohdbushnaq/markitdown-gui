[package]
name = "markitdown-gui"
version = "1.1.0"
edition = "2021"
description = "Portable desktop app for converting documents to Markdown with Microsoft MarkItDown"
authors = ["Mohammed Bushnaq"]
license = "MIT"
repository = "https://github.com/mohdbushnaq/markitdown-gui"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "persistence", "wayland", "x11"] }
rfd = "0.18"
serde = { version = "1", features = ["derive"] }
open = "5"
serde_json = "1"

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
